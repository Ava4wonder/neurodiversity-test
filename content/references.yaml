# =============================================================================
#  REFERENCES: the evidence base for the test set, type set and scoring
# =============================================================================
#  Every item, dimension and type cites keys from this file
#  (`evidence.refs` / `refs`). `npm run validate` fails if a key is missing
#  or unused. `npm run verify-refs` checks each DOI against Crossref and
#  writes reports/reference-verification.md.
#
#  Citing a source here means the CONSTRUCT or FACET is supported by it.
#  Items are original wording. No item is copied from a copyrighted
#  instrument (guidelines section 4.6).
# =============================================================================

meta:
  version: 0.1.0
  style: APA 7 (rendered from fields)

