name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content against the design guidelines
        run: npm run validate
      - name: Unit tests (scoring engine)
        run: npm test
      - name: Scoring simulation (separability + validity rules)
        run: npm run simulate -- --n 200
      - name: Generated docs are up to date
        run: |
          npm run docs
          git diff --exit-code docs/generated || (echo "Run 'npm run docs' and commit the result" && exit 1)
      - name: Type-check and build
        run: npm run build
